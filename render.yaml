# =============================================================================
#  Render blueprint: both halves of the application.
#
#  The storefront and the API are two services here, and the storefront is the
#  only one the public reaches. It serves the built bundle and reverse-proxies
#  /api, /oauth2 and /login/oauth2 to the API over Render's private network, so
#  every request a browser makes is same-origin.
#
#  That is not a preference. The refresh cookie is SameSite=Strict and set by the
#  API; if the browser talked to the API on its own hostname the cookie would
#  belong to that hostname and the storefront could never read it — a customer
#  would finish the whole Google sign-in and land back signed out, with nothing
#  in any log to say why. One origin, one cookie.
#
#  The database is deliberately NOT here. Render's free Postgres is deleted after
#  30 days, which is shorter than most client review cycles — use Neon, Supabase
#  or Aiven and paste the connection details in as GFS_DB_*.
#
#  To use: push this file, then Render -> New -> Blueprint -> pick the repo.
#  Everything marked `sync: false` is prompted for on first deploy and never
#  stored in git.
# =============================================================================

services:
  - type: web
    name: gfs-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore          # closest to the customers this sells to
    healthCheckPath: /actuator/health/readiness

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ---- database ---------------------------------------------------------
      # Neon, Supabase or Aiven. Note the JDBC form: a provider will hand you a
      # `postgresql://user:pass@host/db` URL, and Spring needs the credentials
      # split out and the scheme prefixed with `jdbc:`.
      #
      #   GFS_DB_URL=jdbc:postgresql://ep-xxx.region.aws.neon.tech/gfs?sslmode=require
      #
      # The database must allow `CREATE EXTENSION btree_gist` — migration V3 uses
      # a gist exclusion constraint to make double-booking a coach impossible.
      - key: GFS_DB_URL
        sync: false
      - key: GFS_DB_USER
        sync: false
      - key: GFS_DB_PASSWORD
        sync: false

      # ---- secrets ----------------------------------------------------------
      # Generated by Render, so they never exist on your laptop. The master key
      # is the one that matters: it wraps the per-order keys that encrypt customer
      # EA sign-ins. If it is ever lost those become permanently unreadable, so
      # copy it out of the Render dashboard into a password manager after the
      # first deploy.
      - key: GFS_JWT_SECRET
        generateValue: true
      - key: GFS_QUOTE_SECRET
        generateValue: true
      - key: GFS_CREDENTIAL_MASTER_KEY
        generateValue: true

      # ---- where the site lives ---------------------------------------------
      # Both are the *Vercel* origin, not this service's. GFS_PUBLIC_URL builds the
      # admin deep links inside order alert emails; CORS is belt-and-braces once
      # the Vercel rewrite proxies /api, but set it anyway.
      - key: GFS_PUBLIC_URL
        sync: false
      - key: GFS_CORS_ORIGINS
        sync: false
      - key: GFS_REQUIRE_HTTPS
        value: "true"

      # ---- first sign-in ----------------------------------------------------
      # Without these there is no way into the admin console at all. Change the
      # password from inside the app after the first login.
      - key: GFS_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: GFS_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      # ---- payments ---------------------------------------------------------
      # Use TEST keys for a client demo. Left disabled, checkout runs in stub mode:
      # orders are created but never reach PAID, which means coaching credits are
      # never granted and the booking calendar stays hidden.
      - key: GFS_RAZORPAY_ENABLED
        value: "true"
      - key: GFS_RAZORPAY_KEY_ID
        sync: false
      - key: GFS_RAZORPAY_KEY_SECRET
        sync: false
      - key: GFS_RAZORPAY_WEBHOOK_SECRET
        sync: false

      # ---- social sign-in ---------------------------------------------------
      # sync: false on all four — Render prompts for them in the dashboard and they
      # never enter the repository. The two client IDs are public by design (they
      # ship in the redirect URL); the two secrets are not, and a secret committed
      # here is a secret in every clone of the repo forever.
      #
      # Each provider's console must also list the callback for THIS host:
      #   https://<api-host>/login/oauth2/code/google
      #   https://<api-host>/login/oauth2/code/discord
      - key: GFS_GOOGLE_CLIENT_ID
        sync: false
      - key: GFS_GOOGLE_CLIENT_SECRET
        sync: false
      - key: GFS_DISCORD_CLIENT_ID
        sync: false
      - key: GFS_DISCORD_CLIENT_SECRET
        sync: false

      # ---- coin fulfilment --------------------------------------------------
      # risk-level stays at 2: 3 and above are documented by the supplier as
      # escalating ban risk with no refunds, which the seven-day ban guarantee on
      # this storefront cannot be squared with.
      - key: GFS_FUTTRANSFER_ENABLED
        value: "true"
      - key: GFS_FUTTRANSFER_API_USER
        sync: false
      - key: GFS_FUTTRANSFER_API_KEY
        sync: false
      - key: GFS_FUTTRANSFER_RISK_LEVEL
        value: "2"

      # ---- order alerts -----------------------------------------------------
      # Both of the first two are required. Setting one without the other silently
      # notifies nobody — the app logs a WARN at startup when that happens.
      - key: GFS_EMAIL_ENABLED
        value: "true"
      - key: GFS_OPERATOR_EMAILS
        sync: false
      - key: GFS_EMAIL_FROM
        sync: false
      - key: GFS_SMTP_HOST
        value: smtp.gmail.com
      - key: GFS_SMTP_PORT
        value: "587"
      - key: GFS_SMTP_USER
        sync: false
      - key: GFS_SMTP_PASSWORD      # a Gmail App Password, not the account password
        sync: false
      - key: GFS_SMTP_AUTH
        value: "true"
      - key: GFS_SMTP_TLS
        value: "true"

  # ---------------------------------------------------------------------------
  #  Storefront. The public entry point.
  # ---------------------------------------------------------------------------
  - type: web
    name: gfs-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: singapore          # must match the API: private networking is per-region
    healthCheckPath: /

    envVars:
      # Where nginx forwards /api, /oauth2 and /login/oauth2. Injected by Render
      # from the API service rather than typed, so it cannot drift when the API is
      # renamed or moved. `hostport` is the private host:port — traffic stays on
      # Render's network and never crosses the public internet.
      - key: API_UPSTREAM
        fromService:
          name: gfs-api
          type: web
          property: hostport
      # Empty: the API is proxied through this origin, so `connect-src 'self'`
      # already covers it. Only set this if you stop proxying.
      - key: API_CONNECT_SRC
        value: ""
