<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E7E2FA" />
    <!--
      The icons are the original logo -- the red GLOBAL FUT SERVICES ring -- on white, never on
      black: Google search shows one beside the result. All are made from brand/gfs-mark.png by
      scripts/make-icons.py, square, with padding so a circular crop keeps the ring, and in
      multiples of 48 px as Google asks. favicon.ico (16, 32, 48 inside) is also what anything
      asking for /favicon.ico without reading this page gets.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Global FUT Services — Buy FC 27 Coins, Boosting &amp; Coaching</title>
    <!--
      This is the tab title and the Google result, and it is also the last place the old
      "Safe Trading Service" name and the old "7-day guarantee" survived: the storefront
      renamed both, and a search result naming neither the service nor the cover the site
      actually offers is the version most people read first.
    -->
    <meta name="description"
          content="Buy FC 27 coins, Champs and Rivals boosting, and one-to-one coaching, run by traders who do this all day. Covered by our 100% Safety Policy." />

    <!--
      Fonts are self-hosted through @fontsource rather than loaded from Google.
      Two reasons: every visitor's IP stops being handed to a third party, and the
      strict Content-Security-Policy this site ships with does not need a hole in
      it for someone else's CDN.
    -->

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Global FUT Services — Buy FC 27 Coins, Boosting &amp; Coaching" />
    <meta property="og:description"
          content="Coins, Champs and Rivals boosting, and one-to-one coaching for EA FC 27. Covered by our 100% Safety Policy." />
    <!--
      The share card. `twitter:card` was already declaring `summary_large_image`
      with no image to show it, so every link pasted into WhatsApp, Instagram or
      X rendered as a bare row of text — on a site whose customers share links
      constantly. An absolute URL is required: the crawlers do not resolve
      relative paths, and several refuse to follow a redirect to find one.
    -->
    <meta property="og:image" content="https://globalfutservices.com/brand/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"
          content="Global FUT Services — safe trading, boosting and coaching for EA FC 27." />
    <meta property="og:site_name" content="Global FUT Services" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://globalfutservices.com/brand/og-card.png" />

    <!--
      Who runs the site, for search engines: the name, the address, and the logo Google may
      show for it. A JSON-LD data block, not a script: browsers never run it, so the
      Content-Security-Policy's script-src (no 'unsafe-inline') does not apply to it and
      needs no hole or hash for it.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Global FUT Services",
        "url": "https://globalfutservices.com",
        "logo": "https://globalfutservices.com/icon-512.png"
      }
    </script>
  </head>
  <body class="bg-ink text-chalk antialiased">
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;font-family:system-ui;color:#F7F5FE;background:#1D1636">
        <h1>JavaScript is required</h1>
        <p>Global FUT Services needs JavaScript to price and place orders.
           If you would rather not enable it, email support and we will take your order by hand.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
